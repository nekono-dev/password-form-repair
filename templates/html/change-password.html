<!doctype html>
<!--
  雛形（HTML）: ユーザー名・パスワードを変更するフォーム（現在のパスワード確認つき）。SKILL.md「疑うポイント」#1・#4・#5・#6。
  守ること:
  - 欄順は「ユーザー名(username)・現在のパスワード(current-password)・新パスワード(new-password)」の3欄。
  - 「新しいユーザー名」の別text欄を置かない（位置・autocompleteによらず、現在のパスワード欄へ新パスワードが入る）。
    ユーザー名の変更は、username欄を現在値で初期化して、書き換えた場合だけ送る。
  - ラベルに「確認」「再入力」を含めない（確認欄と誤判定される）。
  - ダイアログ内に置く場合は non-modal-dialog.html のとおり、開いたときだけDOMへ追加する。
-->
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>アカウント設定</title>
  </head>
  <body>
    <main>
      <!-- TODO: data-current-usernameに現在のユーザー名を入れる（サーバ側で埋めるか、スクリプトで設定する） -->
      <form id="change-password-form" data-current-username="">
        <label>
          ユーザー名（変更する場合は書き換える）
          <input type="text" name="username" autocomplete="username" />
        </label>
        <label>
          現在のパスワード
          <input type="password" name="current-password" autocomplete="current-password" required />
        </label>
        <label>
          新しいパスワード（変更する場合のみ）
          <input type="password" name="new-password" autocomplete="new-password" />
        </label>
        <button type="submit">変更</button>
      </form>
    </main>
    <script>
      const form = document.getElementById("change-password-form");
      const currentUsername = form.dataset.currentUsername;
      form.elements.username.value = currentUsername;
      form.addEventListener("submit", async (event) => {
        event.preventDefault();
        const username = form.elements.username.value;
        const newPassword = form.elements["new-password"].value;
        const input = {
          currentPassword: form.elements["current-password"].value,
          ...(username !== "" && username !== currentUsername ? { username } : {}),
          ...(newPassword ? { newPassword } : {}),
        };
        try {
          // TODO: API呼び出し（input を送る）。
          form.elements["new-password"].value = "";
        } finally {
          form.elements["current-password"].value = "";
        }
      });
    </script>
  </body>
</html>
